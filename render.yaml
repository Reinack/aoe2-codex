# Blueprint de Render para el AoE2 Codex (https://render.com/docs/blueprint-spec).
# Un único web service Docker (Node + Python) que sirve la web/API + GraphRAG.
# Los datos viven en Neo4j Aura y el LLM en Gemini (ambos externos).
#
# Deploy: Render → New → Blueprint → conectar este repo. Luego completar en el
# dashboard los env vars marcados como `sync: false` (secretos, no van al repo).
services:
  - type: web
    name: aoe2-codex
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBED_DIM
        value: "768"
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_CHAT_FALLBACK
        value: gemini-flash-latest
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: PYTHON_BIN
        value: /opt/venv/bin/python
      # Límite del chat público (protege el crédito de Gemini).
      - key: CHAT_RL_MAX
        value: "15"
      - key: CHAT_RL_WINDOW_MS
        value: "600000"
      # --- Secretos: cargar en el dashboard de Render (no se versionan) ---
      - key: NEO4J_URI            # neo4j+s://xxxx.databases.neo4j.io
        sync: false
      - key: NEO4J_USER           # neo4j
        sync: false
      - key: NEO4J_PASSWORD       # password de la instancia Aura
        sync: false
      - key: GEMINI_API_KEY       # API key de AI Studio
        sync: false
