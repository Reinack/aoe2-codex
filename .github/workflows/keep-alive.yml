# Ping diario a la demo para que Neo4j Aura Free no se pause.
# Aura Free se pausa a los ~3 días sin conexiones y borra la instancia pausada
# al mes; Render free apaga el servicio a los 15 min sin tráfico, así que nadie
# toca Aura si no entra una visita. /api/health corre `RETURN 1` contra Aura:
# despierta Render y resetea el reloj de Aura de un solo golpe.
#
# Si falla (Aura pausada/borrada, env vars viejas en Render), el job queda en
# rojo y GitHub avisa por mail: sirve también de alerta.
name: keep-alive

on:
  schedule:
    - cron: "17 9 * * *"   # todos los días, 09:17 UTC (06:17 en Uruguay)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Override opcional: Settings → Secrets and variables → Actions → Variables.
      HEALTH_URL: ${{ vars.CODEX_HEALTH_URL || 'https://aoe2-codex.onrender.com/api/health' }}
    steps:
      - name: Ping /api/health
        # El cold start de Render tarda ~50 s y mientras arranca puede responder
        # 502: se reintenta en vez de fallar al primer intento.
        run: |
          curl --fail --silent --show-error \
            --max-time 90 --retry 6 --retry-delay 20 --retry-all-errors \
            "$HEALTH_URL"
