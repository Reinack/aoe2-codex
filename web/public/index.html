<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AoE2 Strategy Codex</title>
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --line:#262d36; --ink:#e6e6e6; --dim:#8b949e;
    --gold:#e8b84b; --blue:#6baed6; --green:#74c476; --purple:#9e9ac8;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line);
    display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; }
  h1 span { color:var(--gold); }
  #stats { color:var(--dim); font-size:13px; }
  #search { margin-left:auto; background:var(--panel); border:1px solid var(--line);
    color:var(--ink); padding:9px 13px; border-radius:8px; width:300px; font-size:14px; }
  .layout { display:grid; grid-template-columns:1fr 1fr; gap:18px; padding:18px 24px; }
  @media(max-width:820px){ .layout{ grid-template-columns:1fr; } }
  .col h2 { font-size:13px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--dim); margin:0 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; cursor:pointer; transition:.12s; }
  .card:hover { border-color:var(--gold); transform:translateY(-1px); }
  .card .t { font-weight:600; }
  .card .a { color:var(--dim); font-size:12px; }
  .tier { float:right; font-weight:700; font-size:13px;
    border:1px solid var(--line); border-radius:5px; padding:0 6px; }
  .tier.A,.tier.S{color:#7ee787;border-color:#2ea043} .tier.B{color:var(--gold)}
  .tier.C{color:#d29922} .tier.D,.tier.E,.tier.F{color:#f85149}
  #detail { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:18px; min-height:200px; }
  #detail .ph { color:var(--dim); }
  #detail h3 { margin:0 0 4px; font-size:22px; }
  #detail .sub { color:var(--dim); margin-bottom:14px; }
  .sect { margin:14px 0; }
  .sect b { color:var(--blue); font-size:13px; text-transform:uppercase; letter-spacing:.4px; }
  .chip { display:inline-block; background:#1f2630; border:1px solid var(--line);
    border-radius:14px; padding:3px 11px; margin:4px 4px 0 0; font-size:13px; }
  .chip.u{ border-color:#5a4b1f; } .chip.t{ border-color:#2f4a30; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
  td { padding:4px 6px; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; color:var(--gold); font-weight:600; }
  #results { position:absolute; top:62px; right:24px; width:300px; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; overflow:hidden; z-index:5; display:none; }
  #results div { padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--line); }
  #results div:hover { background:#1f2630; }
  #results small { color:var(--dim); }
  #chatlog { display:flex; flex-direction:column; gap:8px; margin-bottom:10px;
    max-height:340px; overflow-y:auto; }
  .msg { padding:9px 12px; border-radius:10px; font-size:14px; max-width:92%; }
  .msg.user { align-self:flex-end; background:#1f3550; }
  .msg.bot { align-self:flex-start; background:#1b222b; border:1px solid var(--line); }
  .msg .src { margin-top:8px; color:var(--gold); font-size:12px; }
  .chatrow { display:flex; gap:8px; }
  #chatq { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--ink);
    padding:9px 12px; border-radius:8px; font-size:14px; }
  #chatsend { background:var(--gold); color:#1a1a1a; border:0; border-radius:8px;
    padding:0 18px; font-weight:700; cursor:pointer; }
  #chatsend:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>⚔️ AoE2 <span>Strategy Codex</span></h1>
  <span id="stats"></span>
  <input id="search" placeholder="Buscar (ES/EN): Hostigador, Aztecas, Bloodlines…" autocomplete="off" />
</header>
<div id="results"></div>

<div class="layout">
  <div class="col">
    <h2>Civilizaciones <span id="civcount" style="color:var(--dim)"></span></h2>
    <div class="grid" id="civs"></div>
  </div>
  <div class="col">
    <h2>Chat (GraphRAG · 100% local)</h2>
    <div id="chatlog"></div>
    <div class="chatrow">
      <input id="chatq" placeholder="¿Cómo juego Scout Rush con Georgianos?" autocomplete="off" />
      <button id="chatsend">Enviar</button>
    </div>
    <h2 style="margin-top:20px">Detalle</h2>
    <div id="detail"><div class="ph">Elegí una civilización o buscá una unidad/tecnología.</div></div>
  </div>
</div>

<script>
const api = (p) => fetch(p).then(r => r.json());

async function init() {
  const s = await api("/api/stats");
  document.getElementById("stats").textContent =
    `${s.notes} notas · ${s.links} enlaces · ${s.uu} unidades únicas · ${s.ut} techs únicas`;
  const civs = await api("/api/civs");
  document.getElementById("civcount").textContent = `(${civs.length})`;
  const grid = document.getElementById("civs");
  grid.innerHTML = "";
  for (const c of civs) {
    const slug = c.path.replace("civs/", "").replace(".md", "");
    const tier = c.tierArabia ? `<span class="tier ${c.tierArabia}">${c.tierArabia}</span>` : "";
    const al = c.aliases?.length ? `<div class="a">${c.aliases.join(" · ")}</div>` : "";
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `${tier}<div class="t">${c.title}</div>${al}`;
    el.onclick = () => showCiv(slug);
    grid.appendChild(el);
  }
}

async function showCiv(slug) {
  const d = await api(`/api/civ/${slug}`);
  const det = document.getElementById("detail");
  if (d.error) { det.innerHTML = `<div class="ph">No encontrado.</div>`; return; }
  const chips = (arr, cls) => arr.length
    ? arr.map(x => `<span class="chip ${cls}">${x.title}</span>`).join("")
    : `<span class="ph">—</span>`;
  const tiers = d.tiers.length
    ? `<table>${d.tiers.map(t => `<tr><td>${t.list}</td><td>${t.tier}</td></tr>`).join("")}</table>`
    : `<span class="ph">sin tier</span>`;
  det.innerHTML = `
    <h3>${d.title}</h3>
    <div class="sub">${d.aliases?.length ? "🌎 " + d.aliases.join(" / ") : ""}</div>
    <div class="sect"><b>Unidades únicas</b><br>${chips(d.uniqueUnits,"u")}</div>
    <div class="sect"><b>Tecnologías únicas</b><br>${chips(d.uniqueTechs,"t")}</div>
    <div class="sect"><b>Tier por lista</b>${tiers}</div>`;
}

// búsqueda bilingüe (debounce)
const box = document.getElementById("search");
const results = document.getElementById("results");
let timer;
box.oninput = () => {
  clearTimeout(timer);
  const q = box.value.trim();
  if (!q) { results.style.display = "none"; return; }
  timer = setTimeout(async () => {
    const rows = await api(`/api/search?q=${encodeURIComponent(q)}`);
    if (!rows.length) { results.style.display = "none"; return; }
    results.innerHTML = rows.map(r => {
      const al = r.aliases?.length ? ` · <small>${r.aliases.join(", ")}</small>` : "";
      return `<div data-path="${r.path}" data-type="${r.type}">${r.title}
        <small>(${r.type})</small>${al}</div>`;
    }).join("");
    results.style.display = "block";
    results.querySelectorAll("div").forEach(el => el.onclick = () => {
      results.style.display = "none"; box.value = "";
      if (el.dataset.type === "civs")
        showCiv(el.dataset.path.replace("civs/", "").replace(".md", ""));
      else showNote(el.dataset.path);
    });
  }, 180);
};
document.addEventListener("click", (e) => {
  if (e.target !== box) results.style.display = "none";
});

async function showNote(path) {
  const d = await api(`/api/note?path=${encodeURIComponent(path)}`);
  const det = document.getElementById("detail");
  if (d.error) { det.innerHTML = `<div class="ph">No encontrado.</div>`; return; }
  const nb = d.neighbors.slice(0, 30).map(n =>
    `<span class="chip" data-p="${n.path}" data-ty="${n.type}">${n.title}</span>`).join("");
  det.innerHTML = `
    <h3>${d.title}</h3>
    <div class="sub">${d.type}${d.aliases?.length ? " · 🌎 " + d.aliases.join(" / ") : ""}</div>
    <div class="sect"><b>Conexiones en el grafo</b><br>${nb || "<span class='ph'>—</span>"}</div>`;
  det.querySelectorAll(".chip[data-p]").forEach(el => el.onclick = () => {
    el.dataset.ty === "civs"
      ? showCiv(el.dataset.p.replace("civs/", "").replace(".md", ""))
      : showNote(el.dataset.p);
  });
}

// --- chat GraphRAG ---------------------------------------------------------
const chatq = document.getElementById("chatq");
const chatsend = document.getElementById("chatsend");
const chatlog = document.getElementById("chatlog");
let msgId = 0;

function addMsg(cls, html) {
  const id = `m${++msgId}`;
  const el = document.createElement("div");
  el.className = `msg ${cls}`; el.id = id; el.innerHTML = html;
  chatlog.appendChild(el); chatlog.scrollTop = chatlog.scrollHeight;
  return id;
}
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));

async function ask() {
  const q = chatq.value.trim();
  if (!q) return;
  addMsg("user", esc(q));
  chatq.value = ""; chatsend.disabled = true;
  const tid = addMsg("bot", "⏳ pensando… (gemma3:4b local)");
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q }),
    }).then((x) => x.json());
    const el = document.getElementById(tid);
    if (r.error) { el.innerHTML = "⚠️ " + esc(r.error); return; }
    let html = esc(r.text).replace(/\n/g, "<br>");
    if (!r.abstained && r.sources?.length)
      html += `<div class="src">📚 ${r.sources.map(esc).join(", ")}</div>`;
    el.innerHTML = html;
  } catch (e) {
    document.getElementById(tid).innerHTML = "⚠️ " + esc(String(e));
  } finally {
    chatsend.disabled = false; chatlog.scrollTop = chatlog.scrollHeight;
  }
}
chatsend.onclick = ask;
chatq.onkeydown = (e) => { if (e.key === "Enter") ask(); };

init();
</script>
</body>
</html>
