[project]
name = "aoe2-codex-ingest"
version = "0.1.0"
description = "Pipeline de sync incremental: vault Obsidian -> Neo4j"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20",
    "python-frontmatter>=1.1",
    "watchdog>=4.0",
    "truststore>=0.9",     # TLS vía almacén del SO (Neo4j Aura/Gemini detrás de proxy)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codex*"]
